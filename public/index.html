<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Photo Maker</title>
<link rel="stylesheet" href="/style.css"></head><body>
<div class="card">
  <h1>📸 Live Photo Maker</h1>
  <p>Ubah video jadi foto live (animasi WebP).</p>
  <p class="hint">Video apa pun, berapa pun ukurannya. Bagian tengah video diputar, lalu flash jika aktif, lalu berhenti di foto.</p>
  <input type="file" id="file" accept="video/*">
  <div class="row"><span>⏱ Durasi klip</span>
    <select id="dur"><option value="2">2 detik</option><option value="3" selected>3 detik</option><option value="5">5 detik</option></select></div>
  <div class="row"><span>⚡ Flash</span>
    <label class="sw"><input type="checkbox" id="flash"><span></span></label></div>
  <button class="go" id="go">Buat Foto Live</button>
  <div id="out"></div>
</div>
<script>
const $=s=>document.querySelector(s), FPS=10, MAXS=640;
async function loadVideo(f){
  const v=document.createElement("video");
  v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");v.preload="auto";
  v.style.cssText="position:fixed;left:-9999px;width:2px;height:2px;opacity:0";
  document.body.appendChild(v);
  v.src=URL.createObjectURL(f);
  await new Promise((ok,no)=>{
    v.onloadedmetadata=ok;
    v.onerror=()=>no(new Error("Video tidak bisa dibaca di browser ini"));
    setTimeout(()=>no(new Error("Video terlalu lama dimuat")),15000);
  });
  try{await v.play();v.pause()}catch(e){}      // paksa browser memuat frame
  return v;
}
const seek=(v,t)=>new Promise(r=>{
  let done=false;
  const fin=()=>{if(!done){done=true;v.removeEventListener("seeked",fin);r()}};
  v.addEventListener("seeked",fin);
  const same=Math.abs(v.currentTime-t)<0.02;
  v.currentTime=t;
  setTimeout(fin,same?150:2500);
});

$("#go").onclick=async()=>{
  const f=$("#file").files[0],out=$("#out");
  if(!f){out.innerHTML='<span class="err">Pilih video dulu</span>';return}
  $("#go").disabled=true;let v;
  try{
    out.textContent="Membaca video...";
    v=await loadVideo(f);const d=v.duration;
    if(!isFinite(d)||!v.videoWidth)throw new Error("Durasi/ukuran video tidak terbaca");
    const clip=Math.min(+$("#dur").value,d), start=Math.max(0,d/2-clip/2);
    const n=Math.max(2,Math.round(clip*FPS));
    const sc=Math.min(1,MAXS/Math.max(v.videoWidth,v.videoHeight));
    const c=document.createElement("canvas");
    c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);
    const ctx=c.getContext("2d"), fd=new FormData();
    for(let i=0;i<n;i++){
      out.textContent=`Mengambil frame ${i+1}/${n}...`;
      await seek(v,Math.min(d-0.05,Math.max(0.01,start+clip*i/(n-1))));
      ctx.drawImage(v,0,0,c.width,c.height);
      const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.7));
      if(!b)throw new Error("Gagal mengambil frame");
      fd.append("frames",b,i+".jpg");
    }
    fd.append("flash",$("#flash").checked?"on":"off");
    out.textContent="Membuat foto live...";
    const r=await fetch("/api/convert",{method:"POST",body:fd});
    if(!r.ok){
      let m;try{m=(await r.json()).error}catch(e){}
      throw new Error(m||`Server menolak (HTTP ${r.status})`);
    }
    const url=URL.createObjectURL(await r.blob());
    out.innerHTML=`<img src="${url}"><br><a href="${url}" download="live-photo.webp">⬇ Unduh</a>`;
  }catch(e){out.innerHTML=`<span class="err">${e.message}</span>`}
  if(v)v.remove();
  $("#go").disabled=false;
};
</script></body></html>
