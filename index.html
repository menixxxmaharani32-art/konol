<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Photo Maker</title>
<link rel="stylesheet" href="/style.css"></head><body>
<div class="card">
  <h1>Live Photo Maker</h1>
  <div class="tabs">
    <button class="tab on" data-t="live">Foto Live</button>
    <button class="tab" data-t="hd">HD Foto</button>
  </div>
  <section id="live">
  <p>Ubah video jadi foto live.</p>
  <p class="hint">unggah video</p>
  <input type="file" id="file" accept="video/*">
  <div class="row"><span>Durasi klip</span>
    <select id="dur"><option value="2">2 detik</option><option value="3" selected>3 detik</option><option value="5">5 detik</option></select></div>
  <div class="row"><span>Flash</span>
    <label class="sw"><input type="checkbox" id="flash"><span></span></label></div>
  <button class="go" id="go">Buat Foto Live</button>
  <div id="out"></div>
  </section>
  <section id="hd" hidden>
  <p>Perbesar foto 2x dan perjelas detail (gratis).</p>
  <p class="hint">unggah foto</p>
  <input type="file" id="img" accept="image/*">
  <div class="row"><span>Ketajaman</span>
    <select id="lvl"><option value="normal">Normal</option><option value="strong">Kuat</option></select></div>
  <button class="go" id="hdgo">Buat HD</button>
  <div id="out2"></div>
  </section>
</div>
<script>
const $=s=>document.querySelector(s), MAXS=720;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const FPS=30;        // fps cadangan bila fps asli video tidak terbaca
const MEM=130e6;     // batas memori frame hasil ekstrak (byte), supaya HP tidak kehabisan memori
const RATE=.5;       // video sumber diputar setengah kecepatan saat diekstrak, supaya tidak ada frame yang terlewat
const STILL=1.5;     // lama foto diam di akhir (detik)

// ===== FLASH: 2 JEPRETAN (tanpa kedipan gelap-terang) =====
//  1) jepretan pertama: naik seketika, DITAHAN di puncak (HOLD1 frame @25fps), lalu meredup
//  2) jepretan kedua: tetap seperti sebelumnya (naik, tahan singkat, redup). Di sini video berhenti jadi foto tengah.
// l = naik terang di adegan normal, t = warna cahaya (hangat).
const HOLD1=10;      // 10 frame = 0,4 dtk. Ubah angka ini kalau ingin tahan lebih lama / lebih singkat
const GAP=3;         // jeda antara jepretan 1 dan 2 (frame)
const F1=[...Array(HOLD1).fill(13),8,4.5,1.8];
const F2=[12,12,9,7,3,1.2];                      // jepretan 2: tidak diubah
const SH=F1.length+GAP,KF={};
F1.forEach((l,i)=>KF[i]={l,t:[1,.9,.76]});
F2.forEach((l,i)=>KF[SH+i]={l,t:[1,.9,.78]});
const CUT_N=SH,BLINK_LAST=SH+F2.length-1,BLINK_DUR=(BLINK_LAST+1)/25,LK=142;   // CUT_N = frame pertama jepretan 2: potong ke foto tepat di puncak flash

function mkCanvas(W,H){const c=document.createElement("canvas");c.width=W;c.height=H;return c}
// Semua cahaya dihitung SEBELUM merekam, jadi saat merekam hanya ada beberapa operasi gambar murah per frame.
function makeRig(W,H,kc,k){
  const sw=Math.max(8,W>>3),sh=Math.max(8,H>>3);
  const sm=mkCanvas(sw,sh),sx=sm.getContext("2d",{willReadFrequently:true});          // adegan kasar (perkiraan pantulan)
  sx.imageSmoothingQuality="high";sx.drawImage(kc,0,0,sw,sh);const px=sx.getImageData(0,0,sw,sh).data;
  const b1=mkCanvas(Math.max(4,W>>4),Math.max(4,H>>4)),b1x=b1.getContext("2d");       // lebih kasar lagi untuk pendaran
  b1x.imageSmoothingQuality="high";b1x.drawImage(kc,0,0,b1.width,b1.height);
  const b2=mkCanvas(sw,sh),b2x=b2.getContext("2d",{willReadFrequently:true});
  b2x.imageSmoothingQuality="high";b2x.drawImage(b1,0,0,sw,sh);const bp=b2x.getImageData(0,0,sw,sh).data;
  const mk=new Float32Array(sw*sh);
  const cx=sw*.5,cy=sh*.56,r0=sh*.1,r1=sh*.7;
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){
    const d=Math.hypot(x+.5-cx,y+.5-cy);
    mk[y*sw+x]=1-.85*Math.min(1,Math.max(0,(d-r0)/(r1-r0)));                         // jatuh cahaya: 1 di tengah -> .15 di tepi
  }
  const L={},cache={};
  for(const n in KF){
    const q=KF[n],key=q.l+"|"+q.t.join();
    if(cache[key]){L[n]=cache[key];continue}                                         // frame tahan yang sama dipakai ulang
    const lc=mkCanvas(sw,sh),lx=lc.getContext("2d"),im=lx.createImageData(sw,sh),o=im.data;
    const g=Math.min(.9,q.l/LK*Math.pow(k,1.5));                                     // makin gelap videonya, makin kuat cahayanya
    const fl=(.2+Math.max(0,k-1)*.45)*q.l,bA=Math.min(.5,g*.9);                       // fl = cahaya datar (adegan gelap tetap tersinari)
    for(let i=0;i<sw*sh;i++){for(let c=0;c<3;c++){
      const v=(g*px[i*4+c]*q.t[c]+fl*q.t[c]+bA*bp[i*4+c]*bp[i*4+c]/255)*mk[i];o[i*4+c]=Math.min(255,Math.round(v))}o[i*4+3]=255}
    lx.putImageData(im,0,0);L[n]=cache[key]=lc;
  }
  return {L};
}
// p = posisi di timeline flash (satuan frame @25fps, boleh pecahan).
// Di dalam satu jepretan, dua frame cahaya dicampur halus; naik awal tetap seketika.
function applyBlink(ctx,rig,p,W,H){
  const n=Math.floor(p),f=p-n,a=rig.L[n];if(!a)return;
  const b=rig.L[n+1];
  ctx.imageSmoothingEnabled=true;ctx.globalCompositeOperation="lighter";
  if(b&&b!==a&&f>0){ctx.globalAlpha=1-f;ctx.drawImage(a,0,0,W,H);ctx.globalAlpha=f;ctx.drawImage(b,0,0,W,H)}
  else ctx.drawImage(a,0,0,W,H);
  ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
}
// kekuatan kilat: makin gelap videonya, makin kuat (k=1 untuk adegan normal)
function flashK(src){
  const m=document.createElement("canvas");m.width=m.height=64;
  const mx=m.getContext("2d");mx.imageSmoothingQuality="high";mx.drawImage(src,0,0,64,64);
  const s=document.createElement("canvas");s.width=s.height=16;
  const sx=s.getContext("2d");sx.imageSmoothingQuality="high";sx.drawImage(m,0,0,16,16);
  const d=sx.getImageData(0,0,16,16).data;let y=0;
  for(let i=0;i<d.length;i+=4)y+=.299*d[i]+.587*d[i+1]+.114*d[i+2];
  return Math.max(0.7,Math.min(2.4,124/Math.max(y/256,1)));
}

async function loadVideo(f){
  const v=document.createElement("video");
  v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");v.preload="auto";
  v.style.cssText="position:fixed;left:0;top:0;width:32px;height:32px;opacity:.01;pointer-events:none;z-index:-1";
  document.body.appendChild(v);v.src=URL.createObjectURL(f);
  await new Promise((ok,no)=>{v.onloadedmetadata=ok;
    v.onerror=()=>no(new Error("Video tidak bisa dibaca di browser ini"));
    setTimeout(()=>no(new Error("Video terlalu lama dimuat")),15000)});
  try{await v.play();v.pause()}catch(e){}
  return v;
}
const seek=(v,t)=>new Promise(r=>{let d=false;
  const fin=()=>{if(!d){d=true;v.removeEventListener("seeked",fin);r()}};
  v.addEventListener("seeked",fin);
  const same=Math.abs(v.currentTime-t)<0.02;v.currentTime=t;setTimeout(fin,same?150:2500)});

// ===== EKSTRAK FRAME DULU, BARU REKAM =====
// Penyebab patah-patah/loncat sebelumnya: video diputar real-time sambil direkam, jadi kalau HP telat
// mendekode sebentar, video tetap maju dan adegan terlewat. Sekarang semua frame diambil lebih dulu
// (di jadwal tetap, tanpa terburu-buru), lalu direkam dari memori dengan waktu yang pasti.
function grabPlay(v,T,frames,W,H,say){               // cepat: putar pelan, ambil frame yang SEDANG TAMPIL pada tiap waktu T(i)
  return new Promise(res=>{
    const N=frames.length,EPS=.002,cur=mkCanvas(W,H),cx=cur.getContext("2d");
    let i=0,pm=-1,done=false,timer;
    const give=lim=>{                                   // beri frame 'cur' ke semua target yang waktunya sebelum lim
      if(pm<0||i>=N||!(T(i)+EPS<lim))return;
      const k=mkCanvas(W,H);k.getContext("2d").drawImage(cur,0,0);
      while(i<N&&T(i)+EPS<lim)frames[i++]=k;            // fps video lebih rendah: frame yang sama dipakai ulang
      say(i,N);
    };
    const fin=()=>{if(done)return;done=true;clearTimeout(timer);v.pause();give(pm+1.5/(v.__fps||30));res()};
    const cb=(_,m)=>{
      if(done)return;
      give(m.mediaTime);                                // frame sebelumnya berlaku sampai frame baru ini muncul
      cx.drawImage(v,0,0,W,H);pm=m.mediaTime;
      (i>=N||v.ended)?fin():v.requestVideoFrameCallback(cb);
    };
    v.playbackRate=RATE;v.requestVideoFrameCallback(cb);
    timer=setTimeout(fin,(T(N)-T(0))/RATE*1000+8000);
    v.addEventListener("ended",fin,{once:true});
    v.play().catch(fin);
  });
}
async function grabSeek(v,T,frames,W,H,say){          // cadangan: lompat ke tiap waktu (untuk browser lama / frame yang terlewat)
  for(let i=0;i<frames.length;i++){
    if(frames[i])continue;
    await seek(v,T(i));await sleep(25);
    const c=mkCanvas(W,H);c.getContext("2d").drawImage(v,0,0,W,H);frames[i]=c;say(i+1,frames.length);
  }
}

// fps asli video: diukur dari selisih waktu antar frame, lalu dipakai juga untuk hasil (25 -> 25, 30 -> 30, 60 -> 30),
// supaya tidak ada frame ganda akibat konversi fps yang membuat gerakan terasa patah-patah.
async function probeFps(v,start){
  if(!("requestVideoFrameCallback" in v))return FPS;
  await seek(v,start);
  const ts=[];
  await new Promise(res=>{
    const t=setTimeout(res,1500);
    const cb=(_,m)=>{ts.push(m.mediaTime);ts.length>=14?(clearTimeout(t),res()):v.requestVideoFrameCallback(cb)};
    v.requestVideoFrameCallback(cb);v.playbackRate=1;v.play().catch(res);
  });
  v.pause();
  const dl=ts.slice(1).map((x,i)=>x-ts[i]).filter(x=>x>0).sort((a,b)=>a-b);
  if(dl.length<4)return FPS;
  let f=1/dl[dl.length>>1];
  while(f>31)f/=2;                                        // 60 -> 30, 50 -> 25
  return f<12||f>31?FPS:Math.round(f);
}

function pickMime(){
  return ["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"]
    .find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
}

$("#go").onclick=async()=>{
  const f=$("#file").files[0],out=$("#out");
  if(!f){out.innerHTML='<span class="err">Pilih video dulu</span>';return}
  const mime=pickMime();
  if(!mime){out.innerHTML='<span class="err">Browser ini belum mendukung perekaman video.<br>Jika error, refresh browser Anda.</span>';return}
  $("#go").disabled=true;let v,frames=[],srcUrl;
  try{
    out.textContent="Membaca video...";
    v=await loadVideo(f);srcUrl=v.src;const d=v.duration;
    if(!isFinite(d)||!v.videoWidth)throw new Error("Durasi/ukuran video tidak terbaca");
    const mid=d/2, clip=Math.min(+$("#dur").value,d);              // klip = bagian TENGAH video
    const start=Math.min(Math.max(0,mid-clip/2),d-clip);
    if(clip<0.3)throw new Error("Video terlalu pendek");
    const flashOn=$("#flash").checked;
    const bs=Math.min(1,(clip-0.1)/BLINK_DUR),tb=clip-BLINK_DUR*bs;   // dua jepretan flash di ujung klip
    const vidEnd=flashOn?tb+CUT_N*bs/25:clip;                          // video asli dipakai sampai titik ini (lalu potong ke foto)

    // ukuran & fps: jaga agar semua frame muat di memori HP
    const sc=Math.min(1,MAXS/Math.max(v.videoWidth,v.videoHeight));
    let W=Math.round(v.videoWidth*sc/2)*2, H=Math.round(v.videoHeight*sc/2)*2;
    const fps=await probeFps(v,start);
    const bytes=()=>Math.ceil(vidEnd*fps)*W*H*4;
    if(bytes()>MEM){const s=Math.sqrt(MEM/bytes());W=Math.round(W*s/2)*2;H=Math.round(H*s/2)*2}   // kepenuhan: perkecil sedikit, fps tetap
    const nVid=Math.max(1,Math.ceil(vidEnd*fps));

    // 1) foto utama = frame TENGAH video
    out.textContent="Mengambil foto utama...";
    await seek(v,mid);await sleep(150);
    const kc=mkCanvas(W,H);kc.getContext("2d").drawImage(v,0,0,W,H);

    // 2) flash dihitung di browser (tanpa server)
    const rig=flashOn?makeRig(W,H,kc,flashK(kc)):null;

    // 3) ekstrak semua frame klip lebih dulu
    const T=i=>start+i/fps,say=(i,n)=>{out.textContent=`Menyiapkan frame ${Math.min(i,n)}/${n}...`};
    frames=new Array(nVid).fill(null);
    await seek(v,start);await sleep(150);
    v.__fps=fps;
    if("requestVideoFrameCallback" in v)await grabPlay(v,T,frames,W,H,say);
    await grabSeek(v,T,frames,W,H,say);
    v.pause();

    // 4) rekam dari memori: setiap frame digambar tepat pada jadwalnya (30 fps), bukan mengikuti video yang sedang diputar
    const c=mkCanvas(W,H),ctx=c.getContext("2d");
    const total=Math.round((clip+(flashOn?0:.2)+STILL)*fps);
    const render=i=>{
      const t=i/fps,p=flashOn?(t-tb)/bs*25:-1;
      ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1;
      if(t<clip){
        ctx.drawImage(flashOn&&p>=CUT_N?kc:frames[Math.min(i,nVid-1)],0,0,W,H);   // potong ke foto tepat di puncak jepretan 2
        if(p>=0)applyBlink(ctx,rig,p,W,H);
      }else if(!flashOn&&t<clip+.2){                                              // tanpa flash: dissolve halus ke foto
        ctx.drawImage(frames[nVid-1],0,0,W,H);ctx.globalAlpha=(t-clip)/.2;ctx.drawImage(kc,0,0,W,H);ctx.globalAlpha=1;
      }else ctx.drawImage(kc,0,0,W,H);
    };
    out.textContent=`Merekam ${clip.toFixed(1)} detik...`;
    render(0);
    const chunks=[],rec=new MediaRecorder(c.captureStream(),{mimeType:mime,videoBitsPerSecond:4e6});
    rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    const stopped=new Promise(r=>rec.onstop=r);
    rec.start();render(0);
    const t0=performance.now();let last=-1;
    await new Promise(res=>{(function loop(){
      const now=performance.now()-t0,i=Math.floor(now*fps/1000+.02);   // nomor frame ditentukan jam, jadi kecepatan selalu benar
      if(i>=total){res();return}
      if(i!==last){render(i);last=i}
      setTimeout(loop,Math.max(0,(i+1)*1000/fps-(performance.now()-t0)-1))   // timer tepat per frame (bukan rAF 60Hz yang membuat jeda tak rata untuk 25/24 fps)
    })()});
    rec.stop();await stopped;
    frames.length=0;

    const type=mime.split(";")[0], ext=type.includes("mp4")?"mp4":"webm";
    const blob=new Blob(chunks,{type}), url=URL.createObjectURL(blob), name=`live-photo.${ext}`;
    out.innerHTML=`<video src="${url}" autoplay loop muted playsinline controls></video>
      <div class="btns"><button id="share">Simpan ke Galeri</button><a href="${url}" download="${name}">Unduh</a></div>`;
    $("#share").onclick=async()=>{
      const file=new File([blob],name,{type});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file]})}catch(e){}
      }else{const a=document.createElement("a");a.href=url;a.download=name;a.click()}
    };
  }catch(e){out.innerHTML=`<span class="err">${e.message}<br>Jika error, refresh browser Anda.</span>`}
  if(v)v.remove();
  if(srcUrl)URL.revokeObjectURL(srcUrl);
  $("#go").disabled=false;
};

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  $("#live").hidden=b.dataset.t!=="live";$("#hd").hidden=b.dataset.t!=="hd";
});

$("#hdgo").onclick=async()=>{
  const f=$("#img").files[0],out=$("#out2");
  if(!f){out.innerHTML='<span class="err">Pilih foto dulu</span>';return}
  $("#hdgo").disabled=true;
  try{
    out.textContent="Menyiapkan foto...";
    let bm;
    try{bm=await createImageBitmap(f,{imageOrientation:"from-image"})}catch(e){bm=await createImageBitmap(f)}
    const sc=Math.min(1,1600/Math.max(bm.width,bm.height));
    const c=document.createElement("canvas");
    c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);
    c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    const fd=new FormData();
    fd.append("image",await new Promise(r=>c.toBlob(r,"image/jpeg",0.92)),"photo.jpg");
    fd.append("level",$("#lvl").value);
    out.textContent="Memproses HD...";
    const r=await fetch("/api/hd",{method:"POST",body:fd});
    if(!r.ok){let m;try{m=(await r.json()).error}catch(e){}throw new Error(m||`Server menolak (HTTP ${r.status})`)}
    const blob=await r.blob(),url=URL.createObjectURL(blob);
    out.innerHTML=`<img src="${url}"><div class="btns"><button id="share2">Simpan ke Galeri</button><a href="${url}" download="foto-hd.jpg">Unduh</a></div><p class="note">Diperbesar 2x, noise dirapikan, detail dan kontras dipertegas.</p>`;
    $("#share2").onclick=async()=>{
      const file=new File([blob],"foto-hd.jpg",{type:"image/jpeg"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]})}catch(e){}}
      else{const a=document.createElement("a");a.href=url;a.download="foto-hd.jpg";a.click()}
    };
  }catch(e){out.innerHTML=`<span class="err">${e.message}<br>Jika error, refresh browser Anda.</span>`}
  $("#hdgo").disabled=false;
};
</script></body></html>
