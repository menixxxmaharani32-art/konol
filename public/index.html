<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Photo Maker</title>
<link rel="stylesheet" href="/style.css"></head><body>
<div class="card">
  <h1>📸 Live Photo Maker</h1>
  <p>Ubah foto atau video jadi foto live (animasi WebP).</p>
  <div class="tabs">
    <button class="tab on" data-m="photo">Foto → Live</button>
    <button class="tab" data-m="video">Video → Live</button>
  </div>
  <input type="file" id="file" accept="image/*">
  <div class="row"><span>⚡ Flash</span>
    <label class="sw"><input type="checkbox" id="flash"><span></span></label></div>
  <button class="go" id="go">Buat Foto Live</button>
  <div id="out"></div>
</div>
<script>
let mode="photo";const $=s=>document.querySelector(s);
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");mode=b.dataset.m;
  $("#file").accept=mode==="video"?"video/*":"image/*";$("#file").value="";
});
$("#go").onclick=async()=>{
  const f=$("#file").files[0],out=$("#out");
  if(!f){out.innerHTML='<span class="err">Pilih file dulu</span>';return}
  const fd=new FormData();
  fd.append("file",f);fd.append("mode",mode);
  fd.append("flash",$("#flash").checked?"on":"off");
  $("#go").disabled=true;out.textContent="Memproses...";
  try{
    const r=await fetch("/api/convert",{method:"POST",body:fd});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||"Gagal")}
    const url=URL.createObjectURL(await r.blob());
    out.innerHTML=`<img src="${url}"><br><a href="${url}" download="live-photo.webp">⬇ Unduh</a>`;
  }catch(e){out.innerHTML=`<span class="err">${e.message}</span>`}
  $("#go").disabled=false;
};
</script></body></html>
