<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Photo Maker</title>
<link rel="stylesheet" href="/style.css"></head><body>
<div class="card">
  <h1>Live Photo Maker</h1>
  <div class="tabs">
    <button class="tab on" data-t="live">Foto Live</button>
    <button class="tab" data-t="hd">HD Foto</button>
  </div>
  <section id="live">
  <p>Ubah video jadi foto live.</p>
  <p class="hint">unggah video</p>
  <input type="file" id="file" accept="video/*">
  <div class="row"><span>Durasi klip</span>
    <select id="dur"><option value="2">2 detik</option><option value="3" selected>3 detik</option><option value="5">5 detik</option></select></div>
  <div class="row"><span>Flash</span>
    <label class="sw"><input type="checkbox" id="flash"><span></span></label></div>
  <button class="go" id="go">Buat Foto Live</button>
  <div id="out"></div>
  </section>
  <section id="hd" hidden>
  <p>Perbesar foto 2x dan perjelas detail (gratis).</p>
  <p class="hint">unggah foto</p>
  <input type="file" id="img" accept="image/*">
  <div class="row"><span>Ketajaman</span>
    <select id="lvl"><option value="normal">Normal</option><option value="strong">Kuat</option></select></div>
  <button class="go" id="hdgo">Buat HD</button>
  <div id="out2"></div>
  </section>
</div>
<script>
const $=s=>document.querySelector(s), MAXS=720;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// gambar ulang tiap frame selama ms, supaya perekam terus menangkap frame
const hold=(ms,draw)=>new Promise(res=>{const t0=performance.now();
  (function loop(){draw();performance.now()-t0<ms?requestAnimationFrame(loop):res()})()});
// Flash natural, diukur dari video contoh: naik seketika, tahan sebentar, lalu meredup halus (sekitar 0,5 detik).
// Bukan layar putih: cahaya hangat + kontras turun sedikit + glow lembut, detail foto tetap terlihat.
const FLASH_HOLD=0.06,FLASH_TAU=0.12,FLASH_TOTAL=0.6;
const flashI=t=>t<=FLASH_HOLD?1:Math.exp(-(t-FLASH_HOLD)/FLASH_TAU);
function makeGlow(src,W,H){
  const s=document.createElement("canvas");s.width=Math.max(8,W>>3);s.height=Math.max(8,H>>3);
  s.getContext("2d").drawImage(src,0,0,s.width,s.height);
  const g=document.createElement("canvas");g.width=W;g.height=H;
  const x=g.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(s,0,0,W,H);return g;
}
// kekuatan flash: makin gelap videonya, makin kuat kilatannya (k=1 untuk adegan normal)
function flashK(src){
  const m=document.createElement("canvas");m.width=m.height=64;
  const mx=m.getContext("2d");mx.imageSmoothingQuality="high";mx.drawImage(src,0,0,64,64);
  const s=document.createElement("canvas");s.width=s.height=16;
  const sx=s.getContext("2d");sx.imageSmoothingQuality="high";sx.drawImage(m,0,0,16,16);
  const d=sx.getImageData(0,0,16,16).data;let y=0;
  for(let i=0;i<d.length;i+=4)y+=.299*d[i]+.587*d[i+1]+.114*d[i+2];
  return Math.max(0.7,Math.min(2.8,124/Math.max(y/256,1)));
}
// base = frame terakhir klip, kc = foto utama; a = campuran (dissolve halus dari klip ke foto)
function drawFlash(ctx,base,kc,glow,W,H,I,a,k){
  ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1;
  ctx.drawImage(base,0,0);
  if(a>0){ctx.globalAlpha=a;ctx.drawImage(kc,0,0);ctx.globalAlpha=1}
  ctx.fillStyle=`rgba(0,0,0,${0.11*I*Math.min(k,1)})`;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation="lighter";
  ctx.globalAlpha=Math.min(1,0.05*I*k);ctx.drawImage(glow,0,0,W,H);
  ctx.globalAlpha=1;ctx.fillStyle=`rgba(${Math.round(26*k)},${Math.round(18*k)},${Math.round(12*k)},${I})`;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation="source-over";
}
const loadImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});

async function loadVideo(f){
  const v=document.createElement("video");
  v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");v.preload="auto";
  v.style.cssText="position:fixed;bottom:0;right:0;width:2px;height:2px;opacity:.01;pointer-events:none";
  document.body.appendChild(v);v.src=URL.createObjectURL(f);
  await new Promise((ok,no)=>{v.onloadedmetadata=ok;
    v.onerror=()=>no(new Error("Video tidak bisa dibaca di browser ini"));
    setTimeout(()=>no(new Error("Video terlalu lama dimuat")),15000)});
  try{await v.play();v.pause()}catch(e){}
  return v;
}
const seek=(v,t)=>new Promise(r=>{let d=false;
  const fin=()=>{if(!d){d=true;v.removeEventListener("seeked",fin);r()}};
  v.addEventListener("seeked",fin);
  const same=Math.abs(v.currentTime-t)<0.02;v.currentTime=t;setTimeout(fin,same?150:2500)});

function pickMime(){
  return ["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"]
    .find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
}

$("#go").onclick=async()=>{
  const f=$("#file").files[0],out=$("#out");
  if(!f){out.innerHTML='<span class="err">Pilih video dulu</span>';return}
  const mime=pickMime();
  if(!mime){out.innerHTML='<span class="err">Browser ini belum mendukung perekaman video.<br>Jika error, refresh browser Anda.</span>';return}
  $("#go").disabled=true;let v;
  try{
    out.textContent="Membaca video...";
    v=await loadVideo(f);const d=v.duration;
    if(!isFinite(d)||!v.videoWidth)throw new Error("Durasi/ukuran video tidak terbaca");
    const mid=d/2, clip=Math.min(+$("#dur").value,d);              // klip = bagian TENGAH video
    const start=Math.min(Math.max(0,mid-clip/2),d-clip);
    if(clip<0.3)throw new Error("Video terlalu pendek");
    const sc=Math.min(1,MAXS/Math.max(v.videoWidth,v.videoHeight));
    const W=Math.round(v.videoWidth*sc/2)*2, H=Math.round(v.videoHeight*sc/2)*2;
    const c=document.createElement("canvas");c.width=W;c.height=H;
    const ctx=c.getContext("2d");

    // 1) foto utama = frame TENGAH video
    await seek(v,mid);ctx.drawImage(v,0,0,W,H);
    const kc=document.createElement("canvas");kc.width=W;kc.height=H;kc.getContext("2d").drawImage(c,0,0);

    // 2) siapkan glow untuk flash (dihitung di browser, tanpa server)
    const glow=$("#flash").checked?makeGlow(kc,W,H):null;

    // 3) rekam: klip -> flash -> foto diam
    out.textContent=`Merekam ${clip.toFixed(1)} detik...`;
    const chunks=[],rec=new MediaRecorder(c.captureStream(30),{mimeType:mime,videoBitsPerSecond:4e6});
    rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    const stopped=new Promise(r=>rec.onstop=r);
    await seek(v,start);ctx.drawImage(v,0,0,W,H);
    rec.start();await v.play();
    const t0=performance.now();
    await new Promise(res=>{(function loop(){ctx.drawImage(v,0,0,W,H);
      if(v.currentTime>=start+clip||v.ended||performance.now()-t0>(clip+2)*1000)res();
      else requestAnimationFrame(loop)})()});
    v.pause();
    const lf=document.createElement("canvas");lf.width=W;lf.height=H;lf.getContext("2d").drawImage(c,0,0);
    // klip -> (dissolve halus + flash) -> foto utama (frame tengah)
    const k=flashK(kc),FADE=0.2,total=glow?FLASH_TOTAL:FADE,tf=performance.now();
    await new Promise(res=>{(function loop(){const t=(performance.now()-tf)/1000;
      if(t>=total){res();return}
      const a=Math.min(1,t/FADE);
      if(glow)drawFlash(ctx,lf,kc,glow,W,H,flashI(t),a,k);
      else{ctx.globalAlpha=1;ctx.drawImage(lf,0,0);ctx.globalAlpha=a;ctx.drawImage(kc,0,0);ctx.globalAlpha=1}
      requestAnimationFrame(loop)})()});
    await hold(1500,()=>ctx.drawImage(kc,0,0));
    rec.stop();await stopped;

    const type=mime.split(";")[0], ext=type.includes("mp4")?"mp4":"webm";
    const blob=new Blob(chunks,{type}), url=URL.createObjectURL(blob), name=`live-photo.${ext}`;
    out.innerHTML=`<video src="${url}" autoplay loop muted playsinline controls></video>
      <div class="btns"><button id="share">Simpan ke Galeri</button><a href="${url}" download="${name}">Unduh</a></div>`;
    $("#share").onclick=async()=>{
      const file=new File([blob],name,{type});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file]})}catch(e){}
      }else{const a=document.createElement("a");a.href=url;a.download=name;a.click()}
    };
  }catch(e){out.innerHTML=`<span class="err">${e.message}<br>Jika error, refresh browser Anda.</span>`}
  if(v)v.remove();
  $("#go").disabled=false;
};

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  $("#live").hidden=b.dataset.t!=="live";$("#hd").hidden=b.dataset.t!=="hd";
});

$("#hdgo").onclick=async()=>{
  const f=$("#img").files[0],out=$("#out2");
  if(!f){out.innerHTML='<span class="err">Pilih foto dulu</span>';return}
  $("#hdgo").disabled=true;
  try{
    out.textContent="Menyiapkan foto...";
    let bm;
    try{bm=await createImageBitmap(f,{imageOrientation:"from-image"})}catch(e){bm=await createImageBitmap(f)}
    const sc=Math.min(1,1600/Math.max(bm.width,bm.height));
    const c=document.createElement("canvas");
    c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);
    c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    const fd=new FormData();
    fd.append("image",await new Promise(r=>c.toBlob(r,"image/jpeg",0.92)),"photo.jpg");
    fd.append("level",$("#lvl").value);
    out.textContent="Memproses HD...";
    const r=await fetch("/api/hd",{method:"POST",body:fd});
    if(!r.ok){let m;try{m=(await r.json()).error}catch(e){}throw new Error(m||`Server menolak (HTTP ${r.status})`)}
    const blob=await r.blob(),url=URL.createObjectURL(blob);
    out.innerHTML=`<img src="${url}"><div class="btns"><button id="share2">Simpan ke Galeri</button><a href="${url}" download="foto-hd.jpg">Unduh</a></div><p class="note">Diperbesar 2x, noise dirapikan, detail dan kontras dipertegas.</p>`;
    $("#share2").onclick=async()=>{
      const file=new File([blob],"foto-hd.jpg",{type:"image/jpeg"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]})}catch(e){}}
      else{const a=document.createElement("a");a.href=url;a.download="foto-hd.jpg";a.click()}
    };
  }catch(e){out.innerHTML=`<span class="err">${e.message}<br>Jika error, refresh browser Anda.</span>`}
  $("#hdgo").disabled=false;
};
</script></body></html>
